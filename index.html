<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clark County Aerial Imagery — Basemap Test</title>
    <link
      rel="stylesheet"
      href="https://js.arcgis.com/4.31/esri/themes/light/main.css"
    />
    <style>
      :root {
        color-scheme: light;
        --panel-bg: rgba(255, 255, 255, 0.92);
        --panel-border: rgba(15, 23, 42, 0.12);
        --text: #0f172a;
        --muted: #475569;
        --accent: #0f766e;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        color: var(--text);
        background: #e2e8f0;
      }

      #viewDiv {
        position: absolute;
        inset: 0;
      }

      .panel {
        position: absolute;
        top: 1rem;
        left: 1rem;
        z-index: 1;
        width: min(22rem, calc(100vw - 2rem));
        padding: 1rem 1.1rem;
        border: 1px solid var(--panel-border);
        border-radius: 0.75rem;
        background: var(--panel-bg);
        backdrop-filter: blur(10px);
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.12);
      }

      .panel h1 {
        margin: 0 0 0.35rem;
        font-size: 1rem;
        font-weight: 650;
        line-height: 1.3;
      }

      .panel p {
        margin: 0;
        font-size: 0.875rem;
        line-height: 1.45;
        color: var(--muted);
      }

      .panel a {
        color: var(--accent);
        text-decoration-thickness: 1px;
        text-underline-offset: 2px;
      }

      .meta {
        margin-top: 0.75rem;
        padding-top: 0.75rem;
        border-top: 1px solid var(--panel-border);
        font-size: 0.75rem;
        color: var(--muted);
      }

      .meta code {
        font-size: 0.72rem;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>Clark County Aerial Imagery</h1>
      <p>
        Cached orthophoto tiles from the
        <a
          href="https://maps.clarkcountynv.gov/arcgis_images/rest/services/CACHED/mostcurrentflight/MapServer"
          target="_blank"
          rel="noreferrer"
          >mostcurrentflight</a
        >
        MapServer (Spring 2020 mosaic).
      </p>
      <div class="meta">
        CRS: <code>EPSG:3421</code> (NAD83 Nevada State Plane East, US feet)
      </div>
    </div>
    <div id="viewDiv"></div>

    <script src="https://js.arcgis.com/4.31/"></script>
    <script>
      require([
        "esri/Map",
        "esri/views/MapView",
        "esri/layers/TileLayer",
        "esri/widgets/ScaleBar",
        "esri/widgets/Zoom",
      ], function (Map, MapView, TileLayer, ScaleBar, Zoom) {
        const serviceUrl =
          "https://maps.clarkcountynv.gov/arcgis_images/rest/services/CACHED/mostcurrentflight/MapServer";

        const imageryLayer = new TileLayer({ url: serviceUrl });

        const map = new Map({
          layers: [imageryLayer],
        });

        const view = new MapView({
          container: "viewDiv",
          map,
          spatialReference: { wkid: 3421 },
          center: [862351, 26674696],
          scale: 10000,
          constraints: {
            minScale: 1000000,
            maxScale: 500,
          },
        });

        view.ui.add(new ScaleBar({ view, unit: "dual" }), "bottom-left");
        view.ui.add(new Zoom({ view }), "top-left");
      });
    </script>
  </body>
</html>
